<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TURK | ISH — Истанбулда иш</title>
<meta name="description" content="Истанбулдаги иш эълонлари: маош, туман ва иш тартиби билан. Қидирув ва туман бўйича саралаш.">
<meta name="theme-color" content="#07080b">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:Onest;font-weight:300 800;font-display:swap;src:url(/assets/fonts/onest-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-weight:300 800;font-display:swap;src:url(/assets/fonts/onest-cyrillic-ext.woff2) format('woff2');unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
@font-face{font-family:Onest;font-weight:300 800;font-display:swap;src:url(/assets/fonts/onest-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Onest;font-weight:300 800;font-display:swap;src:url(/assets/fonts/onest-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#07080b;--card:#14151b;--line:rgba(255,255,255,.09);--ink:#f4f4f6;--mute:#9ca1ad;--red:#e30a17;--red-hi:#ff4852}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Onest,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 14px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(90% 40% at 90% -5%,rgba(227,10,23,.32),transparent 70%) var(--bg)}
header{position:sticky;top:0;z-index:5;padding:14px 0 10px;background:linear-gradient(180deg,var(--bg) 70%,rgba(7,8,11,0))}
.top{display:flex;align-items:center;gap:10px}
.top img{width:38px;height:38px;border-radius:50%;border:2px solid var(--red)}
.top b{font-size:18px;letter-spacing:-.02em}.top b span{color:var(--red-hi)}
.top small{display:block;color:var(--mute);font-size:12.5px}
.search{margin-top:12px;display:flex;gap:8px}
.search input{flex:1;height:44px;border-radius:14px;border:1px solid var(--line);background:#101117;color:var(--ink);padding:0 14px;font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:rgba(255,72,82,.6)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#101117;color:var(--mute);font:inherit;font-size:13px;font-weight:500}
.chip.on{background:var(--red);border-color:transparent;color:#fff}
.count{color:var(--mute);font-size:12.5px;margin:6px 2px 8px}
.job{display:block;width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,#171820,#111218);border-radius:18px;padding:14px;margin:0 0 10px;color:inherit;font:inherit;cursor:pointer}
.job h3{margin:0 0 4px;font-size:16px;line-height:1.25;letter-spacing:-.01em}
.co{color:var(--mute);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12.5px;padding:5px 9px;border-radius:10px;background:rgba(255,255,255,.06);color:#dfe1e7}
.pay{background:rgba(227,10,23,.18);color:#ffd5d8;font-weight:700}
.date{margin-left:auto;color:var(--mute);font-size:12px;align-self:center}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{height:46px;border-radius:14px;border:0;font:inherit;font-weight:700;font-size:14px;color:#fff;background:var(--red)}
.btn.ghost{background:#16171e;border:1px solid var(--line)}
.warn{color:var(--mute);font-size:12px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<header>
  <div class="top"><img src="/app/logo.jpg" alt="" onerror="this.style.display='none'"><div><b>TURK <span>| ISH</span></b><small>Истанбулда иш эълонлари</small></div></div>
  <div class="search"><input id="q" type="search" placeholder="Қидириш: garson, омбор, Fatih…" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
</header>
<div class="count" id="count"></div>
<main id="list"></main>
<div class="foot">
  <button class="btn" id="alerts">🔔 Мос иш келсин</button>
  <button class="btn ghost" id="channel">📢 Канал</button>
</div>
<p class="warn">⚠️ Ишга жойлашиш учун ҳеч кимга пул тўламанг.</p>
<script>
const TG = window.Telegram && Telegram.WebApp;
if (TG) { TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor('#07080b'); TG.setBackgroundColor && TG.setBackgroundColor('#07080b'); }
const CHANNEL = 'https://t.me/turk_ish_iskandar', BOT = 'https://t.me/istanbulda_ish_bot';
const open = url => TG && TG.openTelegramLink ? TG.openTelegramLink(url) : (location.href = url);
const months = 'январь февраль март апрель май июнь июль август сентябрь октябрь ноябрь декабрь'.split(' ');
const fold = s => String(s || '').toLowerCase()
  .replace(/[ıi̇]/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ö/g, 'o').replace(/ü/g, 'u')
  .replace(/[ʻʼ'’]/g, '');
const lat = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'j',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'x',ц:'s',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'i',ь:'',э:'e',ю:'yu',я:'ya',ў:'o',қ:'q',ғ:'g',ҳ:'h'};
const norm = s => fold(s).replace(/[а-яёўқғҳ]/g, c => lat[c] || c);
const district = p => { const parts = String(p || '').split(',').map(x => x.trim()).filter(Boolean); return parts[parts.length - 1] || 'İstanbul'; };
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let jobs = [], area = '', paid = false;

function draw() {
  const words = norm(document.getElementById('q').value).split(/\s+/).filter(Boolean);
  const shown = jobs.filter(j => (!area || district(j.place) === area) && (!paid || j.salary)
    && words.every(w => norm([j.title, j.company, j.place, j.salary, j.schedule].join(' ')).includes(w)));
  document.getElementById('count').textContent = shown.length ? `${shown.length} та вакансия` : '';
  document.getElementById('list').innerHTML = shown.slice(0, 120).map(j => {
    const d = new Date(j.date);
    return `<button class="job" data-id="${j.id}"><h3>${esc(j.title)}</h3><div class="co">${esc(j.company)}</div>
      <div class="row">${j.salary ? `<span class="tag pay">💰 ${esc(j.salary)}</span>` : ''}<span class="tag">📍 ${esc(district(j.place))}</span>
      ${j.schedule ? `<span class="tag">⏰ ${esc(j.schedule)}</span>` : ''}<span class="date">${d.getDate()} ${months[d.getMonth()]}</span></div></button>`;
  }).join('') || `<div class="empty">Ҳозирча мос вакансия йўқ.<br>«🔔 Мос иш келсин» тугмасини босинг — чиқиши билан юбораман.</div>`;
}

function chips() {
  const count = {};
  jobs.forEach(j => { const d = district(j.place); if (d !== 'İstanbul') count[d] = (count[d] || 0) + 1; });
  const top = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 10).map(x => x[0]);
  const box = document.getElementById('chips');
  box.innerHTML = `<button class="chip on" data-a="">Ҳаммаси</button><button class="chip" data-paid="1">💰 Маоши бор</button>`
    + top.map(d => `<button class="chip" data-a="${esc(d)}">${esc(d)}</button>`).join('');
  box.onclick = ev => {
    const b = ev.target.closest('.chip'); if (!b) return;
    if (b.dataset.paid) { paid = !paid; b.classList.toggle('on', paid); }
    else { area = b.dataset.a; box.querySelectorAll('[data-a]').forEach(x => x.classList.toggle('on', x === b)); }
    draw();
  };
}

document.getElementById('q').oninput = draw;
document.getElementById('list').onclick = ev => { const b = ev.target.closest('.job'); if (b) open(`${CHANNEL}/${b.dataset.id}`); };
document.getElementById('alerts').onclick = () => open(`${BOT}?start=xabar`);
document.getElementById('channel').onclick = () => open(CHANNEL);
fetch('/data/posts.json', {cache: 'no-cache'}).then(r => r.json()).then(all => {
  jobs = all.filter(p => p.kind === 'job').sort((a, b) => b.id - a.id);
  chips(); draw();
}).catch(() => { document.getElementById('list').innerHTML = '<div class="empty">Юклаб бўлмади. Интернетни текшириб, қайта очинг.</div>'; });
</script>
</body>
</html>
